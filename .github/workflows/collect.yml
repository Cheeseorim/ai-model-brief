name: Collect model updates

on:
  workflow_dispatch:
    inputs:
      summary_max_events:
        description: "Maximum number of new events to summarize in this run"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-model-brief-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect official sources
        run: npm run collect
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # A repository variable can deliberately override this fallback.
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL || 'gpt-5.6-luna' }}
          # Keep the daily backfill large enough to translate the current
          # month's backlog; manual runs can still lower it via the input.
          SUMMARY_MAX_EVENTS: ${{ inputs.summary_max_events || '20' }}
          OPENAI_PROMPT_CACHE_RETENTION: ${{ vars.OPENAI_PROMPT_CACHE_RETENTION || '24h' }}
      - name: Commit changed data
        run: |
          git config user.name "ai-model-brief[bot]"
          git config user.email "ai-model-brief[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: collect model updates"
          # A dashboard/code deployment can land while collection is running.
          # Rebase the completed data commit, not the modified working tree.
          git pull --rebase origin main
          git push
          gh workflow run "Deploy dashboard" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
